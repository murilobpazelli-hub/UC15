<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Reserva de Mesa</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
    
              <form action="" method="POST">
                 <div class="cabecalho">
           
             <h1>Reserve sua Mesa</h1>
              <p>Por favor, preencha o formulário abaixo com atenção para que possamos atendê-lo da melhor forma possível. Seja bem-vindo!</p>
              </div>
             <div class="campo">
                <label for="nome completo">Nome Completo</label>
                <input type="text" id="nome" name="nome" >
                <input type="text" id="sobrenome" name="sobrenome">
                <br>
                <label for="nome">Nome</label>
                <label for="sobrenome">Sobrenome</label>
                <br>
                <br>
                <br>
                <br>
                <label for="E-mail">E-mail</label>
                <input type="text" id="E-mail" name="E-mail" placeholder="ex: myname@example.com" size="50">
                <br>
                <br>
                <br>
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" size="50">
                <br>
                <br>
                <br>
                <label for="pessoas">Número de Pessoas</label>
                <input type="text" id="pessoas" name="pessoas" size="50">
                <br>
                <br>
                <br>
                <br>
                <br>
             </div>
            <div class="reserva">
             <label for="reserva">Reserva</label>
                <br>
                <br>
                <br>
                <br>
                <br>
            </div>
            <div class="area-reserva">
                <label for="tipo-reserva">Tipo de Reserva</label>
                <select id="tipo-reserva" name="tipo-reserva">
                    <option>Please Select</option>
                    <option>Reservas Diretas</option>
                    <option>Reserva Online</option>
                    <option>Reserva por fila</option>
                    <option>Reservas por anúncio</option>
                </select>
                <br>
                <br>
                <br>
                <label for="outro">Se "Outro" acima, especifique</label>
                <input type="text" id="outro" name="outro" size="50">
                <br>
                <br>
                <br>
                <label for="pedidos">Pedidos Especiais</label>
                <input type="text" id="pedidos" name="pedidos" size="50">
             <br>
            </div> 
            
            <div class="botao">
                <button class="button" type="submit">Enviar</button>
            </div>
            

        
        </form>
    </div>
</body>
</html>
